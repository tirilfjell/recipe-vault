<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The same cookbook as the header mark, redrawn for a favicon: fewer details,
    thicker outlines and a filled background, because at 16px the fine strokes of
    the full drawing turn to mud.
  -->

  <!-- The tile, in the app's blue, so the mark reads at any tab size. -->
  <rect width="32" height="32" rx="7" fill="#2727e6" />

  <!-- The spine. -->
  <path
    d="M7 8.5A2.5 2.5 0 0 1 9.5 6H12v20H9.5A2.5 2.5 0 0 1 7 23.5Z"
    fill="#8f3417"
    stroke="#111118"
    stroke-width="1.75"
    stroke-linejoin="round"
  />

  <!-- The cover. -->
  <rect
    x="11"
    y="6"
    width="14"
    height="20"
    rx="2"
    fill="#b4451f"
    stroke="#111118"
    stroke-width="1.75"
  />

  <!-- The heart. -->
  <path
    d="M18 21.5c-2.6-2-4.9-3.5-4.9-5.9a2.9 2.9 0 0 1 4.9-2.1 2.9 2.9 0 0 1 4.9 2.1c0 2.4-2.3 3.9-4.9 5.9Z"
    fill="#ffbac4"
    stroke="#111118"
    stroke-width="1.75"
    stroke-linejoin="round"
  />
</svg>
